<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عجلة الجوائز</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial;background:radial-gradient(circle at top,#293b78,#10152e 65%);color:white;display:flex;align-items:center;justify-content:center;padding:20px}main{width:min(100%,760px);text-align:center}.tag{display:inline-block;border:1px solid #ffffff45;border-radius:99px;padding:7px 14px;color:#ffd166;font-size:13px}h1{font-size:clamp(30px,6vw,48px);margin:16px 0 8px}p{color:#d8def7;line-height:1.8}.wheel-wrap{width:min(82vw,390px);aspect-ratio:1;margin:24px auto 16px;position:relative}.pointer{position:absolute;z-index:2;top:-9px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid white;filter:drop-shadow(0 3px 4px #0008)}#wheel{width:100%;height:100%;border-radius:50%;border:9px solid #ffffff33;box-shadow:0 15px 50px #0008;transition:transform 5s cubic-bezier(.12,.72,.1,1);background:conic-gradient(#f5b700 0deg 72deg,#ef476f 72deg 144deg,#06b6d4 144deg 216deg,#7357e8 216deg 288deg,#24a36b 288deg 360deg);position:relative;overflow:hidden}.label{position:absolute;left:50%;top:50%;width:50%;height:0;transform-origin:left center;font-weight:bold;text-shadow:0 2px 3px #0008;font-size:clamp(11px,2.7vw,15px)}.label span{display:block;width:100%;text-align:center;transform:translateY(-50%);padding-left:12px}button{border:0;border-radius:14px;background:linear-gradient(100deg,#ffd166,#ff9f1c);color:#221735;font-weight:bold;font-size:18px;padding:15px 26px;cursor:pointer}button:disabled{opacity:.55}input{font:inherit;padding:13px;border:1px solid #ffffff55;border-radius:12px;background:#ffffff12;color:white;width:min(100%,330px);text-align:center}input::placeholder{color:#d1d7ed}.panel{margin:18px auto 0;padding:18px;border:1px solid #ffffff24;background:#ffffff0c;border-radius:18px;max-width:520px}#result{font-size:22px;font-weight:bold;color:#ffd166;margin:10px 0}small{color:#bfc8e8;line-height:1.8;display:block;margin-top:16px}.hidden{display:none}.share{margin-top:12px;background:#20b86a;color:white;font-size:15px;padding:11px 18px}
</style></head><body><main><span class="tag">مسابقة الجوائز</span><h1>🎡 عجلة الجوائز</h1><p>أدخل رقم هاتفك مع رمز الدولة، ثم اضغط لتسجيل مشاركتك.<br>تُحفظ النتيجة على الخادم بعد تنفيذ اللفة.</p>
<div class="wheel-wrap"><div class="pointer"></div><div id="wheel"></div></div><div class="panel"><input id="phone" inputmode="tel" autocomplete="tel" placeholder="رقم الهاتف مع رمز الدولة"><div style="margin-top:14px"><button id="spin">لفّ العجلة</button></div><div id="result" aria-live="polite"></div><div id="claim" class="hidden"></div><button id="share" class="share hidden">إرسال الإثبات عبر واتساب</button></div>
<small>نسخة أولية: قبل إطلاق مسابقة حقيقية، يجب توثيق ملكية الهاتف، ونشر الشروط، والتحقق من قانونية المسابقة وتوفر الجوائز.</small></main>
<script>
const prizes=["1000 دولار","آيفون 18","رحلة عمرة","سيارة","حظ أوفر"],wheel=document.getElementById("wheel");
prizes.forEach((n,i)=>{let e=document.createElement("div");e.className="label";e.style.transform=`rotate(${i*72+36}deg)`;let s=document.createElement("span");s.textContent=n;e.appendChild(s);wheel.appendChild(e)});
const btn=document.getElementById("spin"),phone=document.getElementById("phone"),result=document.getElementById("result"),claim=document.getElementById("claim"),share=document.getElementById("share");let busy=false;
btn.onclick=async()=>{if(busy)return;if(phone.value.replace(/\D/g,"").length<8){result.textContent="أدخل رقم هاتف صحيحًا مع رمز الدولة.";return}busy=true;btn.disabled=true;result.textContent="جارٍ تسجيل المشاركة…";claim.classList.add("hidden");share.classList.add("hidden");
try{let r=await fetch("/api/spin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:phone.value})}),d=await r.json();
if(r.status===409&&d.prize){result.textContent="هذا الرقم شارك سابقًا. النتيجة المسجلة: "+d.prize;claim.textContent="رقم المطالبة: "+d.claimCode;claim.classList.remove("hidden");return}
if(!r.ok){result.textContent=d.error||"تعذر تسجيل المشاركة.";return}
let idx=prizes.indexOf(d.prize),stop=360-(idx*72+36),cur=Number(wheel.dataset.rotation||0),target=cur+1800+((stop-cur%360+360)%360);wheel.style.transform=`rotate(${target}deg)`;wheel.dataset.rotation=target;await new Promise(ok=>setTimeout(ok,5100));result.textContent="نتيجتك: "+d.prize;claim.textContent="رقم المطالبة: "+d.claimCode;claim.classList.remove("hidden");share.classList.remove("hidden");share.onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent("نتيجة عجلة الجوائز: "+d.prize+"\\nرقم المطالبة: "+d.claimCode),"_blank","noopener")
}catch(e){result.textContent="تعذر الاتصال بالخادم. تأكد من نشر الموقع."}finally{busy=false;btn.disabled=false}};
</script></body></html>
